name: .NET Core

# Package releases follow org decisions DevelApp-ai/DevelApp-Repo-Global#38
# and #73 (incl. the SHA-256 amendment, 2026-11-12): main-branch pushes pack
# once, SIGN with Certum cloud code signing (SHA-256 fingerprint interface,
# identical on .NET 9/.NET 10 SDKs, no SDK pin), then publish in the fixed
# #73 order - GitHub Packages -> GitHub Release -> NuGet.org - with loud
# failures (no continue-on-error on the NuGet.org push; it is the last
# step so it can never block the org feed or the tagged release). PR builds
# only build+test (no TOTP window is spent on PR builds).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write
  id-token: write # trusted publishing: mint the GitHub OIDC token

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --no-restore --verbosity normal

  package:
    name: Create NuGet Package
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Pack
      run: dotnet pack JsonSchemaBuilder/JsonSchemaBuilder.csproj --configuration Release --output nupkgs
    - name: Upload package
      uses: actions/upload-artifact@v6
      with:
        name: nuget-package
        path: nupkgs/*.nupkg

  sign:
    name: Sign NuGet Package (Certum cloud)
    runs-on: windows-latest
    needs: package
    steps:
    - name: Download package
      uses: actions/download-artifact@v6
      with:
        name: nuget-package
        path: nupkgs/
    - name: Validate signing inputs
      # Fail fast BEFORE the SimplySign login consumes a TOTP window
      # (values are never echoed).
      shell: pwsh
      env:
        CERTUM_SIMPLYSIGN_USERID: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        CERTUM_SIMPLYSIGN_OTP_URI: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        CERTUM_THUMBPRINT: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        CERTUM_FINGERPRINT_SHA256: ${{ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }}
      run: |
        foreach ($name in @('CERTUM_SIMPLYSIGN_USERID','CERTUM_SIMPLYSIGN_OTP_URI','CERTUM_THUMBPRINT','CERTUM_FINGERPRINT_SHA256')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "Missing signing input: $name (org secrets setup, decision #38)"
          }
        }
        $tp = $env:CERTUM_THUMBPRINT -replace '\s',''
        if ($tp -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Certificate thumbprint must be exactly 40 hex characters (CODE_SIGNING_CERT_THUMBPRINT org secret).' }
        $fp = $env:CERTUM_FINGERPRINT_SHA256 -replace '\s',''
        if ($fp -notmatch '^[0-9A-Fa-f]{64}$') { throw 'Certificate fingerprint must be exactly 64 hex characters (CODE_SIGNING_CERT_FINGERPRINT_SHA256 org secret, decision #73 amendment).' }
        $uri = $null
        if (-not [Uri]::TryCreate($env:CERTUM_SIMPLYSIGN_OTP_URI, [UriKind]::Absolute, [ref]$uri) -or
            $uri.Scheme -ne 'otpauth' -or $uri.Host -ne 'totp' -or
            $uri.Query -notmatch '[?&]secret=[A-Za-z2-7]+=*(&|$)') {
          throw 'CERTUM_SIMPLYSIGN_OTP_URI must be the full otpauth://totp provisioning URI (org secrets setup, decision #38).'
        }
    - name: Connect to Certum SimplySign
      # Pinned by full commit SHA; proven by the LocalTaskhandler signing
      # test (run 43089090840, 2026-11-11) and shaztechio/bunyi-app #171.
      # Never sees CERTUM_SIMPLYSIGN_PASSWORD - that secret stays dormant.
      uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
      with:
        certum-username: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        certum-otp-uri: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        certum-key-id: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        capture-diagnostics: 'false'
    - name: Sign NuGet package
      # SHA-256 fingerprint interface (decision #73 amendment, 2026-11-12):
      # works identically on .NET 9 and .NET 10 SDKs; no SDK pin needed.
      shell: pwsh
      env:
        CERTUM_FINGERPRINT_SHA256: ${{ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }}
      run: |
        $fp = ($env:CERTUM_FINGERPRINT_SHA256 -replace '\s','').ToUpperInvariant()
        $packages = @(Get-ChildItem nupkgs/*.nupkg)
        if (-not $packages.Count) { throw 'No package found to sign.' }
        foreach ($p in $packages) {
          dotnet nuget sign $p.FullName --certificate-fingerprint $fp --timestamper http://time.certum.pl
          if ($LASTEXITCODE -ne 0) { throw "Signing failed (exit $LASTEXITCODE): $($p.Name)" }
        }
    - name: Verify signature (gate)
      # Any invalid signature fails the job and blocks publishing.
      shell: pwsh
      run: |
        foreach ($p in @(Get-ChildItem nupkgs/*.nupkg)) {
          dotnet nuget verify $p.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed (exit $LASTEXITCODE): $($p.Name)" }
        }
    - name: Upload signed package
      uses: actions/upload-artifact@v6
      with:
        name: nuget-package-signed
        path: nupkgs/*.nupkg

  publish:
    name: Publish (GitHub Packages -> Release -> NuGet.org)
    runs-on: ubuntu-latest
    needs: [package, sign]
    steps:
    - name: Download signed package
      uses: actions/download-artifact@v6
      with:
        name: nuget-package-signed
        path: nupkgs/
    - name: Determine version
      id: version
      run: |
        PKG=$(basename ./nupkgs/*.nupkg)
        VERSION="${PKG%.nupkg}"
        VERSION="${VERSION#*.}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    # Publishing order per org decision #73: GitHub Packages first, GitHub
    # Release second, NuGet.org last. The NuGet.org push is never
    # continue-on-error - a failure is a visible red job.
    - name: Publish to GitHub Packages
      run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/DevelApp-ai/index.json --skip-duplicate
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release v${{ steps.version.outputs.version }}
        body: |
          Signed NuGet package (Certum cloud signing, org decisions
          DevelApp-Repo-Global#38 + #73). Published to GitHub Packages and
          NuGet.org in the #73 order.
        draft: false
        prerelease: false
        files: ./nupkgs/*.nupkg
    - name: NuGet login (OIDC -> temp API key)
      # Trusted publishing (replaces the long-lived NUGET_API_KEY secret):
      # GitHub mints a short-lived OIDC token, nuget.org validates it against
      # this repo's registered trusted-publishing policy and returns a ~1h
      # API key. Login once, immediately before the push.
      uses: NuGet/login@v1
      id: nuget
      with:
      # nuget.org profile name (NOT the email)
        user: ${{ secrets.NUGET_USER }}
    - name: Publish to NuGet.org
      run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
